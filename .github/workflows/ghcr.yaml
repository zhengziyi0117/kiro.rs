name: Build and Push GHCR Image

# Fork 自用：推送到 ghcr.io/<owner>/kiro-rs，使用内置 GITHUB_TOKEN，无需额外 secrets。
# ponytail: 仅 linux/amd64（部署机为 x86_64），需要 arm64 时加 matrix。
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          SRC: ${{ github.server_url }}/${{ github.repository }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/kiro-rs" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "src=${SRC}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.src }}
            org.opencontainers.image.description=Kiro.rs (fork)
